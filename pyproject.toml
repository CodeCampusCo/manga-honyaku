[project]
name = "manga-honyaku"
version = "0.1.0"
description = "Manga translation workflow: code does the geometry, the agent does the comprehension."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.6",
    # The image processor resizes through torchvision when it is present and
    # through PIL when it is not, and the two do not agree to the pixel. Left
    # optional, detection results drift with whatever happens to be installed.
    "torchvision",
    "transformers>=4.49",
    "pillow>=11",
    "opencv-python-headless>=5.0.0.93",
    "pythainlp>=5.3.4",
]

[tool.uv]
# Stages are run as `uv run python -m manga_honyaku.<stage>` from the repo root;
# nothing imports this tree as an installed distribution yet.
package = false
